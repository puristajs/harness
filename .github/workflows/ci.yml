name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-build-test:
    name: Lint, build, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --cache .sandbox-verification/npm-cache

      - name: Release gates
        run: npm run ci

  memory-live:
    name: Live memory engines
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harness_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --cache .sandbox-verification/npm-cache

      - name: Architecture
        run: npm run verify:architecture

      - name: Standard Schema boundary
        run: npm run verify:standard-schema

      - name: Release metadata
        run: npm run verify:release-metadata

      - name: Start NATS JetStream
        run: docker run --detach --rm --name purista-memory-nats --publish 4222:4222 --publish 8222:8222 nats:2.12.15-alpine -js -m 8222

      - name: Wait for NATS JetStream
        run: curl --fail --retry 20 --retry-connrefused http://localhost:8222/healthz

      - name: PostgreSQL + pgvector contract
        env:
          POSTGRES_MEMORY_URL: postgresql://postgres:postgres@localhost:5432/harness_memory
        run: npm run test:live -w @purista/harness-memory-postgres

      - name: Redis Search contract
        env:
          REDIS_MEMORY_URL: redis://localhost:6379
        run: npm run test:live -w @purista/harness-memory-redis

      - name: NATS JetStream KV contract
        env:
          NATS_URL: nats://localhost:4222
        run: npm run test:live -w @purista/harness-memory-nats

  verify-and-publish:
    name: Verify and publish
    needs: [lint-build-test, memory-live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'puristajs/harness'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@purista'

      - name: Install
        run: npm ci --cache .sandbox-verification/npm-cache

      - name: Release gates
        run: npm run ci

      - name: Verify package contents
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { execSync } = require('node:child_process')

          const packageDirs = fs.readdirSync(path.join(process.cwd(), 'packages'), { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(process.cwd(), 'packages', entry.name))
            .filter((dir) => fs.existsSync(path.join(dir, 'package.json')))
            .map((dir) => {
              const pkg = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'))
              return { dir, pkg }
            })
            .filter(({ pkg }) => pkg.private !== true && pkg.name !== '@purista/harness-guardrails-native-privacy')
            .sort((a, b) => {
              if (a.pkg.name === '@purista/harness') return -1
              if (b.pkg.name === '@purista/harness') return 1
              return a.pkg.name.localeCompare(b.pkg.name)
            })

          for (const { pkg } of packageDirs) {
            console.log(`Packing ${pkg.name}`)
            execSync(`npm pack --workspace "${pkg.name}" --dry-run`, { stdio: 'inherit' })
          }
          NODE

      - name: Publish packages
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { execSync } = require('node:child_process')

          const packageDirs = fs.readdirSync(path.join(process.cwd(), 'packages'), { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => path.join(process.cwd(), 'packages', entry.name))
            .filter((dir) => fs.existsSync(path.join(dir, 'package.json')))
            .map((dir) => {
              const pkg = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'))
              return { dir, pkg }
            })
            .filter(({ pkg }) => pkg.private !== true && pkg.name !== '@purista/harness-guardrails-native-privacy')
            .sort((a, b) => {
              if (a.pkg.name === '@purista/harness') return -1
              if (b.pkg.name === '@purista/harness') return 1
              return a.pkg.name.localeCompare(b.pkg.name)
            })

          for (const { dir, pkg } of packageDirs) {
            const spec = `${pkg.name}@${pkg.version}`

            try {
              const published = execSync(`npm view "${spec}" version --registry=https://registry.npmjs.org --silent`, {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe']
              }).trim()
              if (published === pkg.version) {
                console.log(`Skipping ${spec} because it is already published.`)
                continue
              }
            } catch {
              // npm view exits non-zero when this exact version has not been published yet.
            }

            console.log(`Publishing ${spec}`)
            execSync('npm publish --access public', { cwd: dir, stdio: 'inherit' })
          }
          NODE
