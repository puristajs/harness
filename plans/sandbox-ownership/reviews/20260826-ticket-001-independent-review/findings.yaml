    actual: "The summary schema accepts a workspace resource with a sandbox scope when its owner matches."
    evidence: "The built schema successfully parsed a workspace summary containing a shared session scope."
    fix_boundary: "packages/harness/src/sandbox/administration.ts and packages/harness/src/sandbox/administration.test.ts"
    required_verification:
