      - "npm --prefix ai-harness run test:unit --workspace @purista/harness"
  - id: REVIEW-SOWN-004
    severity: blocking
    category: SECURITY
    root_cause: implementation_drift
    status: fixed
    owner_ticket: TICKET-001
    route: implementation
    spec_refs:
      - ai-harness/specs/36-sandbox-ownership-and-administration/03-contracts/api.md#CTR-SOWN-ERRORS
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#ACC-SOWN-SAFETY
    impacted_path: "Serialized sandbox quota failure"
    location: "packages/harness/src/errors/catalog.ts:153"
    expected: "New safe-error metadata is closed and cannot serialize owner IDs, identity, paths, cursors, payloads, or provider diagnostics."
    actual: "SandboxQuotaExceededError forwards the caller-provided meta object unchanged; a JavaScript caller can add owner or other sensitive properties. No safe-error metadata schema enforces closure."
    evidence: "serializeError(new SandboxQuotaExceededError({ quota: 'snapshots', limit: 1, owner: 'SENTINEL' })) emitted meta.owner."
    fix_boundary: "packages/harness/src/errors/catalog.ts and packages/harness/src/errors/catalog.test.ts"
    required_verification:
      - "Use a closed validated metadata representation or construct only approved fields before HarnessError serialization."
      - "Add a sentinel serialization assertion proving extra owner/identity values cannot cross the public error boundary."
      - "npm --prefix ai-harness run test:unit --workspace @purista/harness"
