      - ai-harness/specs/36-sandbox-ownership-and-administration/03-contracts/api.md#validation-and-generation
    impacted_path: "Session construction input"
    location: "packages/harness/src/sandbox/ownership.ts:116"
    expected: "The data-only SessionOptions boundary is a strict source-derived DTO schema with its exported type inferred from that schema."
    actual: "SessionOptions is a handwritten interface and no strict session-options schema exists; it is not within the function-bearing/capability-generic exception."
    evidence: "The ownership module exports schemas for neighboring DTOs but only an interface for SessionOptions."
    fix_boundary: "packages/harness/src/sandbox/ownership.ts, packages/harness/src/sandbox/ownership.test.ts, and packages/harness/type-tests/sandbox-ownership.ts"
    required_verification:
      - "Add closed-schema fixtures for SessionOptions, including an unknown field."
      - "npm --prefix ai-harness run test:types"
      - "npm --prefix ai-harness run test:unit --workspace @purista/harness"
  - id: REVIEW-SOWN-003
    severity: blocking
    category: INTERFACE
    root_cause: implementation_drift
    status: fixed
    owner_ticket: TICKET-001
    route: implementation
    spec_refs:
      - ai-harness/specs/36-sandbox-ownership-and-administration/03-contracts/api.md#CTR-SOWN-ADMIN
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#ACC-SOWN-SAFETY
