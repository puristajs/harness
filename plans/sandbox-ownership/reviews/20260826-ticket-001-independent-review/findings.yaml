      - ai-harness/specs/36-sandbox-ownership-and-administration/00-conventions.md#CONV-SOWN-TYPES
    impacted_path: "External owner registration with an invalid canonical ULID"
    location: "packages/harness/src/sandbox/ownership.ts:6"
    expected: "Externally supplied instanceId values accept only the canonical 128-bit ULID range produced by the existing ULID helper."
    actual: "The regex accepts Z1JQ7Z9Q69STZ33MGH6V5ASR7J because every Crockford base32 character is permitted in the first position."
    evidence: "The built schema returned success for that value during independent review."
    fix_boundary: "packages/harness/src/sandbox/ownership.ts and packages/harness/src/sandbox/ownership.test.ts"
    required_verification:
      - "Add a failing fixture for an over-range first ULID character and prove rejection."
      - "npm --prefix ai-harness run typecheck --workspace @purista/harness"
      - "npm --prefix ai-harness run test:unit --workspace @purista/harness"
  - id: REVIEW-SOWN-002
