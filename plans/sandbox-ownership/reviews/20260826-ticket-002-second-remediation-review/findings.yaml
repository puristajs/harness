findings:
  - id: REVIEW-002-010
    severity: blocking
    category: ROBUSTNESS
    root_cause: implementation_drift
    status: open
    owner_ticket: TICKET-002
    route: implementation
    spec_refs:
      - ai-harness/specs/36-sandbox-ownership-and-administration/00-vision.md#REQ-SOWN-SAFETY
      - ai-harness/specs/36-sandbox-ownership-and-administration/02-administration.md#offboarding-and-purge
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#ACC-SOWN-ADMIN
    impacted_path: "Process crashes after durable cleanup claim and before final deletion record"
    location: "ai-harness/packages/harness/src/sandbox/catalog.ts:179-196,276-282"
    expected: "A restart or exact purge retry can reconcile every known cleanup-pending resource after a crashed claimant without silently recreating it or permanently suppressing deletion."
    actual: "cleanupClaim is a durable random UUID with no recovery owner, expiry, reconciliation, or release path other than the original caller. Subsequent purge calls select only resources with cleanupClaim === undefined, so the resource is excluded indefinitely."
    evidence: "A crash after the staging mutate at lines 167-187, or after provider callback succeeds before line 192, leaves cleanupClaim persisted. load preserves it and all later purge calls filter it out at line 179."
    fix_boundary: "ai-harness/packages/harness/src/sandbox/catalog.ts and ai-harness/packages/harness/src/sandbox/catalog.test.ts only"
    required_verification:
      - "npm --prefix ai-harness exec --workspace @purista/harness vitest run src/sandbox/catalog.test.ts"
      - "npm --prefix ai-harness run test:unit --workspace @purista/harness"
    agent_instruction: "Replace the permanent claimant marker with a private recovery-safe cleanup-attempt protocol. It must prevent concurrent live callbacks yet let a restarted authority reconcile a dead claimant safely, preserving state-loss/pending semantics and without exposing a public lease. Add a crash-after-claim/restart/retry fixture."
  - id: REVIEW-002-011
    severity: blocking
    category: ROBUSTNESS
    root_cause: implementation_drift
    status: open
    owner_ticket: TICKET-002
    route: implementation
    spec_refs:
      - ai-harness/specs/36-sandbox-ownership-and-administration/02-administration.md#offboarding-and-purge
      - ai-harness/specs/36-sandbox-ownership-and-administration/03-contracts/api.md#CTR-SOWN-ADMIN
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#ACC-SOWN-ADMIN
    impacted_path: "Concurrent snapshot delete or retention sweep deletes one backing resource"
    location: "ai-harness/packages/harness/src/sandbox/catalog.ts:204-225,227-258"
    expected: "Every private cleanup path coordinates a resource deletion attempt, so concurrent operator calls or sweeps do not duplicate a provider callback for the same backing resource."
    actual: "deleteSnapshot and sweep set cleanup_pending but take no cleanupClaim before releasing the catalog lock for deleteResource. A concurrent identical call sees cleanup_pending as eligible and invokes the callback again."
    evidence: "deleteSnapshot matches any non-deleted snapshot at line 209 and sweep selects every non-deleted cleanup-pending resource at line 235; neither path reads or writes cleanupClaim."
    fix_boundary: "ai-harness/packages/harness/src/sandbox/catalog.ts and ai-harness/packages/harness/src/sandbox/catalog.test.ts only"
    required_verification:
      - "npm --prefix ai-harness exec --workspace @purista/harness vitest run src/sandbox/catalog.test.ts"
      - "npm --prefix ai-harness run typecheck --workspace @purista/harness"
    agent_instruction: "Use the same private recovery-safe attempt coordination for purge, deleteSnapshot, and sweep. Add deterministic concurrent snapshot-delete and concurrent-sweep tests proving one callback per resource while preserving retry after failure."
  - id: REVIEW-002-009
    severity: blocking
    category: TEST
    root_cause: implementation_drift
    status: open
    owner_ticket: TICKET-002
    route: implementation
    spec_refs:
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#ACC-SOWN-ADMIN
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#ACC-SOWN-SAFETY
    impacted_path: "Local cross-process serialization and sweep cancellation"
    location: "ai-harness/packages/harness/src/local/local-sandbox-catalog.test.ts:30-42; ai-harness/packages/harness/src/sandbox/catalog.test.ts"
    expected: "Deterministic regression tests prove independent-process lock contention and a mid-sweep abort that leaves remaining resources pending."
    actual: "The local test shares one Node process, and the catalog test inventory has no sweep-cancellation fixture."
    evidence: "The source has a process-oriented lock file and sweep cancellation branches, but neither branch has the required behavioral proof."
    fix_boundary: "ai-harness/packages/harness/src/local/local-sandbox-catalog.test.ts and ai-harness/packages/harness/src/sandbox/catalog.test.ts only"
    required_verification:
      - "npm --prefix ai-harness exec --workspace @purista/harness vitest run src/sandbox/catalog.test.ts src/local/local-sandbox-catalog.test.ts"
      - "npm --prefix ai-harness run typecheck --workspace @purista/harness"
    agent_instruction: "Complete the remaining two fixture paths from the prior review without weakening scope: real independent-process (or controlled equivalent that does not share module state) lock contention, and abort during a multi-resource sweep with truthful retained/pending state."
