      - ai-harness/plans/sandbox-ownership/wave_02_private_catalogs/tickets/TICKET-013-packed_verification.md#Acceptance
    impacted_path: "fixture import is changed from the public Harness entrypoint to an alias or private subpath"
    location: "ai-harness/scripts/check-purista-sandbox.mjs:82-90, 151-175, 195-233"
    expected: "Fixture staging validates the imports it copies and rejects every non-public Harness specifier before compilation/runtime verification."
    actual: "assertPublicHarnessSpecifier is exported and unit-tested but is never called while source or consumer fixtures are staged."
    evidence: "The only call sites are the test literals in check-purista-sandbox.test.mjs:55-59; rg finds no production call site."
    fix_boundary: "ai-harness/scripts/check-purista-sandbox.mjs and ai-harness/scripts/check-purista-sandbox.test.mjs only"
    required_verification:
      - "node --test ai-harness/scripts/check-purista-sandbox.test.mjs"
      - "Test that an aliased/private fixture is rejected by staging before any package install or compile."
    agent_instruction: "Make the existing validation helper part of the staging path (or replace it with an equally narrow parsed-import check); do not add aliases, shims, or source fallback."
  - id: REVIEW-013-005
    severity: blocking
    category: TRACEABILITY
