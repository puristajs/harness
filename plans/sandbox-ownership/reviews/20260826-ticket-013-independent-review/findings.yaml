findings:
  - id: REVIEW-013-001
    severity: blocking
    category: OPERATIONS
    root_cause: implementation_drift
    status: open
    owner_ticket: TICKET-013
    route: implementation
    spec_refs:
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#VERIFY-SOWN-PACKAGED-PURISTA
      - ai-harness/plans/sandbox-ownership/wave_02_private_catalogs/tickets/TICKET-013-packed_verification.md#Operational-Path-Coverage
    impacted_path: "staged source/consumer/docs child command fails or scratch cleanup fails"
    location: "ai-harness/scripts/check-purista-sandbox.mjs:70-79"
    expected: "Keep failure evidence in the approved plan-evidence location, remove only the invocation-created scratch child when cleanup succeeds, and report incomplete cleanup without replacing the command failure."
    actual: "The unconditional finally removes every invocation scratch directory and lets an rm failure replace the original command error. No failure evidence is preserved or reported."
    evidence: "The only cleanup test at check-purista-sandbox.test.mjs:34-53 exercises a successful operation; no failure or cleanup-error path is tested."
    fix_boundary: "ai-harness/scripts/check-purista-sandbox.mjs and ai-harness/scripts/check-purista-sandbox.test.mjs only"
    required_verification:
      - "node --test ai-harness/scripts/check-purista-sandbox.test.mjs"
      - "Prove a failing child preserves content-free failure evidence while deleting only its own run-* directory."
      - "Prove cleanup failure is reported alongside, rather than replacing, the child failure."
    agent_instruction: "Add bounded, content-safe failure evidence under the approved plan evidence directory and test both command failure and cleanup failure; do not retain scratch trees or broaden deletion authority."
  - id: REVIEW-013-002
    severity: blocking
    category: ROBUSTNESS
    root_cause: implementation_drift
    status: open
    owner_ticket: TICKET-013
    route: implementation
    spec_refs:
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#VERIFY-SOWN-PACKAGED-PURISTA
      - ai-harness/plans/sandbox-ownership/wave_02_private_catalogs/tickets/TICKET-013-packed_verification.md#Test-First-Order
    impacted_path: "caller cancels an in-progress source, consumer, or docs verification"
    location: "ai-harness/scripts/check-purista-sandbox.mjs:115-128, 187-233, 261-271"
    expected: "The runner's supplied AbortSignal reaches every build, pack, install, compilation, test, and docs child process, stops further steps, and follows the failure-evidence/cleanup rules."
    actual: "runPuristaSandboxVerification accepts a signal but only checks it before creating the layout; buildAndPackHarness, both direct execFileSync pack calls, and every run*Mode call omit it."
    evidence: "check-purista-sandbox.test.mjs:85-97 only aborts runCheckedCommand directly, which is not the top-level runner path."
    fix_boundary: "ai-harness/scripts/check-purista-sandbox.mjs and ai-harness/scripts/check-purista-sandbox.test.mjs only"
    required_verification:
      - "node --test ai-harness/scripts/check-purista-sandbox.test.mjs"
      - "Add an integration-level cancellation test that begins the runner, cancels during a guarded child step, and proves no subsequent child starts."
    agent_instruction: "Thread the signal through every child invocation, including pack commands, and add a runner-level cancellation test; retain offline and exact-scratch constraints."
  - id: REVIEW-013-003
    severity: blocking
    category: SUPPLY_CHAIN
    root_cause: implementation_drift
    status: open
    owner_ticket: TICKET-013
    route: implementation
    spec_refs:
      - ai-harness/specs/36-sandbox-ownership-and-administration/04-verification.md#VERIFY-SOWN-PACKAGED-PURISTA
      - ai-harness/plans/sandbox-ownership/wave_02_private_catalogs/tickets/TICKET-013-packed_verification.md#Spec-Drift-Controls
    impacted_path: "pack local Harness/Core/Docker packages for an offline verification run"
    location: "ai-harness/scripts/check-purista-sandbox.mjs:115-118; ai-harness/scripts/check-purista-sandbox.mjs:201-203; ai-harness/scripts/check-sandbox-packages.mjs:16-19"
    expected: "Every npm invocation participating in verification has explicit workspace-local cache/output authority and no default network fallback."
    actual: "All three npm pack calls bypass cacheArguments, have no --offline or --cache argument, and use execFileSync directly."
    evidence: "Only npm install receives --offline --ignore-scripts --no-audit --no-fund --cache. The packed-package commands do not."
    fix_boundary: "ai-harness/scripts/check-purista-sandbox.mjs, ai-harness/scripts/check-sandbox-packages.mjs, and ai-harness/scripts/check-purista-sandbox.test.mjs only"
    required_verification:
      - "node --test ai-harness/scripts/check-purista-sandbox.test.mjs"
      - "Add a command-argument test covering every npm pack/install child invocation."
      - "node ai-harness/scripts/check-purista-sandbox.mjs --mode source with an explicitly prepopulated local cache"
    agent_instruction: "Route pack execution through the same guarded command policy or an equivalently testable helper; use only the invocation cache/output paths and preserve separate known build commands."
  - id: REVIEW-013-004
    severity: blocking
    category: INTERFACE
    root_cause: implementation_drift
    status: open
    owner_ticket: TICKET-013
    route: implementation
    spec_refs:
