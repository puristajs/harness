confirmed_decisions:
  - "The Cloudgrid adapter package belongs in ~/projekte/@cloudgrid/cloudgrid, not in ai-harness."
  - "ai-harness owns backend-agnostic telemetry emission, trace-context propagation, run summaries, deterministic local scorer helpers, and prompt candidate evaluation helpers."
  - "OTel GenAI is the primary telemetry convention; OpenInference is emitted as an interoperability shape when telemetry flavor includes it."
  - "Telemetry content capture controls spans and span events only; persisted StateStore run events remain content-redacted in v1."
  - "No Python, Optuna, product dataset store, prompt-version store, experiment database, or Cloudgrid-specific HTTP API belongs in harness core."
  - "Memory is a core harness port with a pluggable MemoryAdapter interface."
  - "The current sandbox-backed memory behavior becomes the core reference adapter exposed as sandboxMemory()."
  - "External memory backends live in independent @purista/harness-memory-* packages."
  - "Core owns standard memory spans, metrics, validation, error mapping, and content-capture enforcement so adapters do not duplicate that behavior."
inferred_defaults:
  - "Telemetry flavor defaults to PURISTA_TELEMETRY_FLAVOR, else dual."
  - "Content capture defaults to OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT, else NO_CONTENT."
  - "Memory defaults to sandboxMemory()."
  - "Session.memory remains the simple session-scoped facade for direct application access."
