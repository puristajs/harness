traceability_version: 1
requirements:
  - requirement_id: REQ-MEM-DX
    statement: The builder provides zero-config memory, direct engine configuration, and capability-safe model references with no duplicate provider or profile configuration.
    capability_ids:
      - CAP-MEM-DX
    path_ids:
      - PATH-MEM-DX
    acceptance_ids:
      - ACC-MEM-DX
  - requirement_id: REQ-MEM-IDENTITY
    statement: Tenant and principal are independent optional dimensions bound to sessions and every memory lifetime scope.
    capability_ids:
      - CAP-MEM-IDENTITY
    path_ids:
      - PATH-MEM-IDENTITY
    acceptance_ids:
      - ACC-MEM-IDENTITY
  - requirement_id: REQ-MEM-ENGINE
    statement: Core owns orchestration and all database implementations satisfy one public MemoryEngine contract.
    capability_ids:
      - CAP-MEM-ENGINE
    path_ids:
      - PATH-MEM-ENGINE
    acceptance_ids:
      - ACC-MEM-ENGINE
  - requirement_id: REQ-MEM-SEARCH
    statement: Text semantic and hybrid search support filters pagination deterministic defaults and no silent downgrade.
    capability_ids:
      - CAP-MEM-SEARCH
    path_ids:
      - PATH-MEM-SEARCH
    acceptance_ids:
      - ACC-MEM-SEARCH
  - requirement_id: REQ-MEM-SUMMARY
    statement: Opt-in summary refresh uses a typed object model and preserves complete conversation history with provenance.
    capability_ids:
      - CAP-MEM-SUMMARY
    path_ids:
      - PATH-MEM-SUMMARY
    acceptance_ids:
      - ACC-MEM-SUMMARY
  - requirement_id: REQ-MEM-OTEL
    statement: Memory operations follow Harness telemetry while nested model spans own provider model token and cost data.
    capability_ids:
      - CAP-MEM-OTEL
    path_ids:
      - PATH-MEM-OTEL
    acceptance_ids:
      - ACC-MEM-OTEL
  - requirement_id: REQ-MEM-SQLITE
    statement: The SQLite package provides local persistent FTS memory with no required third-party runtime dependency and explicit optional sqlite-vec exact search.
    capability_ids:
      - CAP-MEM-SQLITE
    path_ids:
      - PATH-MEM-SQLITE
    acceptance_ids:
      - ACC-MEM-SQLITE
  - requirement_id: REQ-MEM-POSTGRES
    statement: The PostgreSQL package provides persistent multi-instance text vector and atomic memory behavior through pg and pgvector.
    capability_ids:
      - CAP-MEM-POSTGRES
    path_ids:
      - PATH-MEM-POSTGRES
    acceptance_ids:
      - ACC-MEM-POSTGRES
  - requirement_id: REQ-MEM-REDIS
    statement: The Redis package provides persistent multi-instance text vector TTL and atomic memory behavior through the official Redis client.
    capability_ids:
      - CAP-MEM-REDIS
    path_ids:
      - PATH-MEM-REDIS
    acceptance_ids:
      - ACC-MEM-REDIS
  - requirement_id: REQ-MEM-NATS
    statement: The NATS package provides truthful distributed KV memory over official JetStream KV packages with bounded enumeration and no relevance-search claim.
    capability_ids:
      - CAP-MEM-NATS
    path_ids:
      - PATH-MEM-NATS
    acceptance_ids:
      - ACC-MEM-NATS
  - requirement_id: REQ-MEM-PURISTA
    statement: PURISTA attached agents and workflows reuse declared models and message identity through one optional ai memory configuration.
    capability_ids:
      - CAP-MEM-PURISTA
    path_ids:
      - PATH-MEM-PURISTA
    acceptance_ids:
      - ACC-MEM-PURISTA
  - requirement_id: REQ-MEM-MIGRATION
    statement: Implementation docs website examples skills and exports complete a clean break with no legacy or duplicate public API.
    capability_ids:
      - CAP-MEM-MIGRATION
    path_ids:
      - PATH-MEM-MIGRATION
    acceptance_ids:
      - ACC-MEM-MIGRATION
