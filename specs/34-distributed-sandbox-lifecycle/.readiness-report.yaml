review_notes:
  - Fresh approval is bound to this manifest under the owner's standing auto-approval and subsequently expanded implementation authorization; it is not carried forward from the earlier planning digest.
  - The review converged local and distributed behavior on one topology-transparent Sandbox lifecycle interface; multi-client coordination is adapter-private conformance, not a runtime capability, subtype, or method family.
  - The review removed HarnessStorage lifecycle extensions, public leases/fences/provider refs, core lifecycle defaults, cleanup scheduling, and a standalone lifecycle subsystem.
  - Production provider implementation remains outside the approved scope until DEC-SBX-PROVIDER is separately approved from bake-off evidence.
  - The owner requested the local Docker addon as its own package; one Docker CLI/context implementation serves OrbStack without PURISTA or core-internal imports.
  - Local Docker is separately approved and contract-gated, not provider-selection-gated. Its first slice retains files but deliberately fails unsupported checkpoint restore without mutation.
  - Current Docker and OrbStack primary docs were checked on 2026-08-26. No engine, image, package, or runtime implementation was installed or exercised during planning.
  - The owner requested an explicit clean break across existing adapters. The source inventory now includes both local-directory variants, localDurableExecution binding, shared fakes/snapshot suites, inline test doubles, all session/run/child-task callers, and active guidance.
  - ACC-SBX-CLEAN-BREAK requires one green integration with negative old-API tests and no compatibility paths; existing local durable recovery and user files must not be lost during the rewrite.
  - Implementation review strengthened session incarnation and explicit storage write/delete intent without putting sandbox coordination into storage.
  - Local workspace ownership, process admission and cleanup, missing-checkpoint recovery, and terminal-result preservation are now explicit requirements with regression evidence.
  - Optional snapshot resume reuses full target scope and base sessions; it participates in target lifecycle without conflating snapshots with committed workspace recovery or adding a compatibility API.
  - Coverage and architecture gates and isolated packed Harness/Docker runtime/declaration checks pass. Packed PURISTA runtime and consumer-code checking pass; pre-existing external declaration dependency failures remain explicit in the completion audit.
  - Spec approval does not claim npm publication, verified Docker Desktop/Linux support, or generic AFK ticket-format readiness; see the completion evidence for those limits.
