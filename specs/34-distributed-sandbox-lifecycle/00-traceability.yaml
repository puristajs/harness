traceability_version: 1
requirements:
  - requirement_id: REQ-SBX-DOCKER
    statement: One optional standalone Docker addon also serves OrbStack, retains scoped local files, enforces local ownership and security, and fails missing state or unsupported restore without empty replacement.
    capability_ids: [CAP-SBX-DOCKER]
    path_ids: [PATH-SBX-DOCKER, PATH-SBX-DOCKER-LOSS]
    acceptance_ids: [ACC-SBX-DOCKER, ACC-SBX-DOCKER-LOSS]
  - requirement_id: REQ-SBX-BOUNDARY
    statement: Sandbox coordination remains adapter-private; HarnessStorage strengthens session integrity without lifecycle records or methods, and PURISTA depends only on public Harness APIs.
    capability_ids: [CAP-SBX-OPEN, CAP-SBX-CLEANUP, CAP-SBX-PURISTA]
    path_ids: [PATH-SBX-OPEN, PATH-SBX-PURISTA]
    acceptance_ids: [ACC-SBX-BOUNDARY]
  - requirement_id: REQ-SBX-IDENTITY
    statement: Logical scope uses exact optional Harness identity and rejects session identity mismatch before sandbox access.
    capability_ids: [CAP-SBX-IDENTITY]
    path_ids: [PATH-SBX-IDENTITY]
    acceptance_ids: [ACC-SBX-IDENTITY]
  - requirement_id: REQ-SBX-FENCING
    statement: Two clients create one generation and stale attachments cannot mutate compute without exposing fences publicly.
    capability_ids: [CAP-SBX-OPEN, CAP-SBX-FENCE]
    path_ids: [PATH-SBX-OPEN, PATH-SBX-STALE]
    acceptance_ids: [ACC-SBX-OPEN, ACC-SBX-STALE]
  - requirement_id: REQ-SBX-RECOVERY
    statement: Missing compute is replaced only after committed durable-workspace recovery and is never silently replaced by empty state.
    capability_ids: [CAP-SBX-RECOVER]
    path_ids: [PATH-SBX-RESTORE, PATH-SBX-STATE-LOST]
    acceptance_ids: [ACC-SBX-RESTORE, ACC-SBX-STATE-LOST]
  - requirement_id: REQ-SBX-CLEANUP
    statement: Detach and explicit termination are idempotent while adapter-owned retention and cleanup require no Harness maintenance subsystem.
    capability_ids: [CAP-SBX-CLEANUP]
    path_ids: [PATH-SBX-DETACH, PATH-SBX-TERMINATE]
    acceptance_ids: [ACC-SBX-CLEANUP]
  - requirement_id: REQ-SBX-PRIVACY
    statement: Standard telemetry excludes scope identity provider coordination checkpoint path command and content values.
    capability_ids: [CAP-SBX-OBSERVE]
    path_ids: [PATH-SBX-OBSERVE]
    acceptance_ids: [ACC-SBX-PRIVACY]
  - requirement_id: REQ-SBX-CONTRACT
    statement: All existing adapters fakes callers and active docs replace the old API without compatibility paths; every adapter passes the base lifecycle contract and every production distributed adapter also passes shared two-client conformance without runtime topology branches.
    capability_ids: [CAP-SBX-CONTRACT]
    path_ids: [PATH-SBX-CONTRACT]
    acceptance_ids: [ACC-SBX-CONTRACT, ACC-SBX-CLEAN-BREAK]
  - requirement_id: REQ-SBX-BAKEOFF
    statement: E2B and Daytona use one approved probe before production adapter selection or implementation.
    capability_ids: [CAP-SBX-BAKEOFF]
    path_ids: [PATH-SBX-BAKEOFF]
    acceptance_ids: [ACC-SBX-BAKEOFF]
