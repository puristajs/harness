verification:
  - verification_id: VERIFY-SBX-CLEAN-BREAK
    command: npm test --workspace @purista/harness -- test/sandbox-lifecycle-clean-break.test.ts test/local-durable-execution.test.ts test/session-lifecycle.test.ts test/workflow-child-tasks.test.ts test/sandbox-snapshot.test.ts test/public-api.test.ts
  - verification_id: VERIFY-SBX-DOCKER-UNIT
    command: npm test --workspace @purista/harness-sandbox-docker
  - verification_id: VERIFY-SBX-DOCKER-LIVE
    command: npm run test:docker --workspace @purista/harness-sandbox-docker
    precondition: Explicit opt-in and pre-provisioned disposable local engine/image; script added by SBX-013, not run by default CI.
  - verification_id: VERIFY-SBX-TYPES
    command: npm run test:types
  - verification_id: VERIFY-SBX-CONTRACT
    command: npm run test:contracts
  - verification_id: VERIFY-SBX-INTEGRATION
    command: npm run test:integration
  - verification_id: VERIFY-SBX-FAILURE
    command: npm run test:failure
  - verification_id: VERIFY-SBX-PRIVACY
    command: npm test -- sandbox-lifecycle-telemetry
  - verification_id: VERIFY-SBX-DEPENDENCIES
    command: npm run verify:architecture
  - verification_id: VERIFY-SBX-BAKEOFF
    command: provider probe command defined by SBX-006 after contract completion
