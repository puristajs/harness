mappings:
  - mapping_id: MAP-GA-DEFAULTS
    from_shape: guardrails.config-input
    to_shape: guardrails.config
    direction: custom
    allowed_differences:
      - "rails:default_empty"
      - "all_other_fields:copy_exact"
    redaction_or_loss_policy: Only the specified field operations are permitted; opaque implementation data is never serialized.
    field_operations:
      - "rails:default_empty"
      - "all_other_fields:copy_exact"
    verification:
      - 03-flows/e2e-coverage.md
  - mapping_id: MAP-GA-ACTION
    from_shape: guardrails.action-definition
    to_shape: guardrails.action-token
    direction: custom
    allowed_differences:
      - "phase:copy_literal"
      - "callback_and_schema:private_prepared_thunk"
      - "dependency_declarations:clone_private"
      - "public_callback:omit"
    redaction_or_loss_policy: Only the specified field operations are permitted; opaque implementation data is never serialized.
    field_operations:
      - "phase:copy_literal"
      - "callback_and_schema:private_prepared_thunk"
      - "dependency_declarations:clone_private"
      - "public_callback:omit"
    verification:
      - 03-flows/e2e-coverage.md
  - mapping_id: MAP-GA-TOOL
    from_shape: tool.definition
    to_shape: tool.registered-definition
    direction: custom
    allowed_differences:
      - "all_definition_fields:copy"
      - "private_symbol:add_true"
    redaction_or_loss_policy: Only the specified field operations are permitted; opaque implementation data is never serialized.
    field_operations:
      - "all_definition_fields:copy"
      - "private_symbol:add_true"
    verification:
      - 03-flows/e2e-coverage.md
  - mapping_id: MAP-GA-ERROR
    from_shape: guardrails.config-error-meta
    to_shape: runtime.serialized-error
    direction: custom
    allowed_differences:
      - "meta:copy_validated_fields"
      - "code:constant_GUARDRAILS_CONFIG_ERROR"
      - "message:fixed"
      - "category:config"
      - "retriable:false"
      - "cause:omit"
    redaction_or_loss_policy: Only the specified field operations are permitted; opaque implementation data is never serialized.
    field_operations:
      - "meta:copy_validated_fields"
      - "code:constant_GUARDRAILS_CONFIG_ERROR"
      - "message:fixed"
      - "category:config"
      - "retriable:false"
      - "cause:omit"
    verification:
      - 03-flows/e2e-coverage.md
