    status: not_applicable
    scope_refs: [CAP-SS-PROVIDERS]
    rationale: Adapter seams and fake providers prove pass-through locally; no secrets or live calls are needed.
  - concern_id: business_compliance
    status: not_applicable
    scope_refs: [CAP-SS-TYPES, CAP-SS-VALIDATION, CAP-SS-PROJECTION, CAP-SS-PROVIDERS, CAP-SS-CONSUMERS, CAP-SS-CLEANUP]
    rationale: No business, legal, payment, identity or approval semantics change.
  - concern_id: data_persistence_schema
    status: not_applicable
    scope_refs: [CAP-SS-VALIDATION]
    rationale: Existing run/session storage shapes remain unchanged; the refactor only enforces the pre-existing JsonValue invariant before persistence.
